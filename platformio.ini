; M5StickS3 GPS Logger (用户 v3.2.0) 移植到 ESP-IDF 5.4.2 —— 与 furble 同底座
; M1: 记录器功能回归（无 BLE）
[env:sticks3]
platform = espressif32@6.12.0
platform_packages = framework-espidf@3.50402.0
framework = espidf
board = esp32-s3-devkitc-1
board_build.f_cpu = 80000000L
board_build.partitions = partitions.csv
upload_protocol = esptool
monitor_speed = 115200
lib_deps =
  M5PM1@1.0.6
  M5GFX@0.2.19
  M5Unified@0.2.13
build_flags = -Wall -Wno-error=format
extra_scripts = pre:patches/apply.py
